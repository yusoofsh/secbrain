name: Prepare memory workflows
on:
  push:
    branches: [feat/workflow-runtime-20261004]
    paths: [.github/workflows/prepare-workflows.yml, scripts/prepare-workflows.mjs]
permissions:
  contents: write
concurrency:
  group: prepare-memory-workflows
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'yusoofsh/secbrain' && github.ref == 'refs/heads/feat/workflow-runtime-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Integrate reviewed source and remove temporary preparation
        run: |
          node scripts/prepare-workflows.mjs
          bun scripts/export-workflow-skills.ts
          git rm .github/workflows/prepare-workflows.yml scripts/prepare-workflows.mjs
      - name: Verify scope, types, full tests and Worker artifact
        run: |
          npm run check:scope
          npm run typecheck
          npm test -- --maxWorkers=2
          npx --no-install wrangler deploy --dry-run --outdir /tmp/verified-memory-workflows
      - name: Commit validated source on the feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/workflows/core.ts src/ui/deep-link.ts src/mcp/server.ts src/ui/bridge.ts src/ui/memory-explorer.ts test/unit/workflow-foundation.test.ts test/unit/deep-link.test.ts skills
          git diff --cached --check
          git commit -m 'Validate memory review workflows and preserve authorization contracts'
          git push origin HEAD:refs/heads/feat/workflow-runtime-20261004
