name: CI
on:
  push:
    branches: [main, "v*"]
  # Keep every pull-request base covered, including release branches.
  pull_request:
  # Full golden-set evaluation remains opt-in; ranking behavior is unchanged here.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run check:scope -- --inventory
      # The full suite passed with two workers. Avoid oversubscribing the hosted
      # runner while coverage instrumentation competes with short lease timers.
      # All test files, coverage collection and assertions remain enabled.
      - run: npm run test:coverage -- --maxWorkers=2
      - name: Build check (wrangler dry-run)
        run: npx wrangler deploy --dry-run
      - name: Build check (desktop worker bundle)
        working-directory: installer
        run: npm ci && npm run bundle-worker
      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2

  # Golden-set and workerd evaluation is intentionally a manual gate for ranking
  # changes. The default suite still checks the synthetic replay harness.
  eval-full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test:eval:full

  # Both shipping desktop platforms remain mandatory; a Worker-only build does
  # not replace Rust tests or desktop UI checking.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: installer/src-tauri -> target
      - run: npm ci --legacy-peer-deps
      - run: npm ci
        working-directory: installer
      - name: Bundle Worker (required by build.rs)
        working-directory: installer
        run: npm run bundle-worker
      - name: Typecheck desktop UI
        working-directory: installer
        run: npx tsc --noEmit
      - name: Test desktop app
        run: cargo test --manifest-path installer/src-tauri/Cargo.toml
