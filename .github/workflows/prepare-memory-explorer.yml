name: Prepare Memory Explorer
on:
  push:
    branches: [feat/memory-explorer-extension-20261004]
    paths: [.github/workflows/prepare-memory-explorer.yml, scripts/prepare-memory-explorer.mjs, src/mcp/handler.ts, src/mcp/modern.ts, test/integration/memory-explorer.test.ts, test/integration/event-http.test.ts]
permissions:
  contents: write
concurrency:
  group: prepare-memory-explorer
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'yusoofsh/secbrain' && github.ref == 'refs/heads/feat/memory-explorer-extension-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Apply the reviewed source integration
        run: |
          node scripts/prepare-memory-explorer.mjs
          git rm .github/workflows/prepare-memory-explorer.yml scripts/prepare-memory-explorer.mjs
      - name: Validate the full scope, type and test contracts
        run: npm run check:scope && npm run typecheck && npm test
      - name: Verify the Worker artifact without deployment
        run: npx --no-install wrangler deploy --dry-run --outdir /tmp/secbrain-explorer-worker
      - name: Commit validated source on the feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui src/mcp/server.ts
          git diff --cached --check
          git commit -m 'Wire and validate scoped memory browsing and modern resources'
          git push origin HEAD:refs/heads/feat/memory-explorer-extension-20261004
